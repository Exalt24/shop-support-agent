name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  python-root:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: localsuper
          POSTGRES_DB: console
        ports:
          - 54931:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      # Chromium for the chat widget tests (tests/test_widget_browser.py). Without it those tests skip on a laptop.
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      # The engine and the console suites run as two commands: their two conftest.py files collide in one run.
      - name: Engine tests (scripted model, fake shop, fake Zoho)
        run: python -m pytest tests -q
      # The widget tests again, named, with SHOP_SUPPORT_REQUIRE_BROWSER set so a missing Chromium FAILS here instead of skipping.
      - name: Chat widget on two demo sites (real Chromium, real server, fake Zoho)
        env:
          SHOP_SUPPORT_REQUIRE_BROWSER: "1"
        run: python -m pytest tests/test_widget_browser.py -q -rs
      - name: Console schema, roles and forced row level security
        run: python -m console_api.migrate --reset
      - name: Console tests (isolation, roles, login, memory)
        run: python -m pytest tests_console -q
  node-console_web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: "console_web"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "console_web/package-lock.json"
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint (zero warnings)
        run: npm run lint
